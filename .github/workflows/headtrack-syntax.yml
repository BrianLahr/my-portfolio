name: HeadTrack syntax
on:
  push:
    paths:
      - 'headtrack/**'
      - '.github/workflows/headtrack-syntax.yml'
  pull_request:
    paths:
      - 'headtrack/**'
      - 'index.html'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m py_compile headtrack/bridge.py headtrack/engine/*.py
      - run: node --check headtrack/app.mjs
